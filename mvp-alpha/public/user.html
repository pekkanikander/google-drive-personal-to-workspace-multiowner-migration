<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration User (Alpha)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; max-width: 720px; }
    .status { white-space: pre-wrap; background: #f7f7f7; padding: 8px; border: 1px solid #eee; min-height: 60px; }
    .error { color: #c00; }
    .success { color: #0a6; }
    button { padding: 10px 14px; font-size: 1rem; }
    .stats { margin: 16px 0; padding: 8px; border: 1px solid #eee; background: #fafafa; }
    .muted { color: #666; font-size: 0.9rem; }
    .file-list { margin-top: 16px; }
    .file-list ol { padding-left: 22px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Migration User (Alpha)</h1>
  <p>This page is reached via the admin-provided link. It validates the link, signs you in, and checks the job sheet.</p>

  <div id="status" class="status"></div>
  <div class="stats">
    <div><strong>Files to move:</strong> <span id="stat-total">-</span></div>
    <div><strong>Moved:</strong> <span id="stat-moved">0</span></div>
  </div>
  <section id="file-list-container" class="file-list hidden">
    <h2>Files to move</h2>
    <div id="file-list-note" class="muted">Paths shown relative to the source root.</div>
    <ol id="file-list"></ol>
  </section>
  <button id="btn-start">Sign in and validate job</button>

  <script type="module" src="./dist/user.js"></script>
</body>
</html>
